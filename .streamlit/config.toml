[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

# The product defaults to a light trading terminal. These values match
# ui/theme.py's LIGHT palette so Streamlit's own chrome (dataframes, tooltips,
# skeletons) paints in the correct theme before the design-system stylesheet.
[theme]
base = "light"
primaryColor = "#147D92"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0D1424"
