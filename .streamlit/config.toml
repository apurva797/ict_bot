[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

# The product is a dark trading terminal. These values match ui/theme.py's
# DARK palette so Streamlit's own chrome (dataframes, tooltips, skeletons)
# paints in the correct theme before the design-system stylesheet applies.
[theme]
base = "dark"
primaryColor = "#3FC0D0"
backgroundColor = "#070A12"
secondaryBackgroundColor = "#101624"
textColor = "#E9EEF8"
